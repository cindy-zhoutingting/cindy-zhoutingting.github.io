<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
  <head>
    <title>{{ site.title }} - Publications</title>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#f5f6fb">

    <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.baseurl }}/{{ site.favicon_dark }}" type="image/png" />
    <link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.baseurl }}/{{ site.favicon }}" type="image/png" />
    <script src="{{ site.baseurl }}/assets/js/favicon-switcher.js" type="application/javascript"></script>

    <link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin=anonymous>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    {% if site.font == "Sans Serif" %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/font_sans_serif.css">
    {% else %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/font.css">
    {% endif %}
    {% if site.auto_dark_mode %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/publications.css">
    {% else %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style-no-dark-mode.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/publications-no-dark-mode.css">
    {% endif %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/custom.css">

    <script>
      // 首帧即确定主题，避免闪白
      (function () {
        document.documentElement.classList.add('js');
        try {
          var stored = localStorage.getItem('theme');
        } catch (e) { var stored = null; }
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body class="publications-page">
    <!-- 背景装饰层 -->
    <div class="bg-decor" aria-hidden="true">
      <div class="aurora a1"></div>
      <div class="aurora a2"></div>
      <div class="aurora a3"></div>
      <svg class="bg-mountains" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
        <path class="mt3" d="M0,150 C160,110 260,170 380,140 C500,110 600,165 720,138 C840,112 940,168 1060,142 C1180,116 1300,170 1440,138 L1440,300 L0,300 Z"/>
        <path class="mt2" d="M0,196 C130,168 250,214 360,190 C470,166 560,206 690,186 C820,166 900,208 1030,190 C1160,172 1290,212 1440,186 L1440,300 L0,300 Z"/>
        <path class="mt1" d="M0,238 C150,214 280,252 420,232 C560,212 680,248 820,230 C960,212 1080,250 1220,232 C1330,218 1390,240 1440,230 L1440,300 L0,300 Z"/>
      </svg>
    </div>
    <div class="bg-noise" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div class="scroll-progress" aria-hidden="true"></div>

    <!-- 返回主页 -->
    <div class="back-home-btn">
      <a href="{{ site.baseurl }}/" class="home-link">
        <i class="fas fa-arrow-left"></i>
        <span>返回主页</span>
      </a>
    </div>

    <!-- 深色模式切换按钮 -->
    <div class="top-bar">
      <div class="container">
        <div class="dark-mode-toggle-top">
          <button id="dark-mode-btn" aria-label="切换深色模式" aria-pressed="false">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 主要内容 -->
    <div class="content">
      {{ content }}
    </div>

    {% include back-to-top.html %}
    <script src="{{ site.baseurl }}/assets/js/main.js"></script>

    <script>
      // 深色模式切换
      (function () {
        var btn = document.getElementById('dark-mode-btn');
        if (!btn) return;
        var root = document.documentElement;

        function render() {
          var dark = root.getAttribute('data-theme') === 'dark';
          btn.innerHTML = dark
            ? '<i class="fas fa-sun"></i>'
            : '<i class="fas fa-moon"></i>';
          btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#070b18' : '#f5f6fb');
        }

        btn.addEventListener('click', function () {
          var dark = root.getAttribute('data-theme') === 'dark';
          root.setAttribute('data-theme', dark ? 'light' : 'dark');
          try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
